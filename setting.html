<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings - GenAI</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

    <h1 style="color:red;">Settings Page Working</h1>

<div class="app">

<div class="settings-screen">

<div class="chat-header">

<button class="back-btn" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</button>

<h2>Settings</h2>

</div>

<div class="setting-card">

<h3>🎨 Appearance</h3>

<label><input type="radio" name="theme"> Light</label>

<label><input type="radio" name="theme"> Dark</label>

<label><input type="radio" name="theme"> System</label>

</div>

<div class="setting-card">

<h3>🔤 Font Size</h3>

<select id="fontSize">

<option>Small</option>

<option selected>Medium</option>

<option>Large</option>

</select>

</div>

<div class="setting-card">

<h3>🎵 Sound Effects</h3>

<label>

<input type="checkbox" id="soundToggle" checked>

Enable Sounds

</label>

</div>

<div class="setting-card">

<h3>🌍 Language</h3>

<select>

<option>English</option>

<option>Hindi</option>

<option>Hinglish</option>

</select>

</div>

<div class="setting-card">

<h3>🔔 Daily Reminder</h3>

<label>

<input type="checkbox">

Enable Reminder

</label>

</div>

<div class="setting-card">

<h3>ℹ️ About GenAI</h3>

<p>

Version 1.0

<br><br>

A safe space where every emotion matters. 💙

</p>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
