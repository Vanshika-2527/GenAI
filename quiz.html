<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emotional Check-In | GenAI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#EEF5FF,#F7F3FF);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}


.container{
width:390px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#5A67D8;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
font-size:15px;
}

.question{
margin-bottom:25px;
}

.question h3{
margin-bottom:12px;
color:#333;
font-size:18px;
}

label{
display:block;
background:#F8F9FF;
padding:12px;
margin:8px 0;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

label:hover{
background:#E9EDFF;
}

input[type=radio]{
margin-right:10px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#5A67D8;
color:white;
font-size:17px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#4654c8;
}

#result{
display:none;
margin-top:25px;
padding:20px;
border-radius:18px;
background:#EEF5FF;
text-align:center;
}

#result h2{
margin-bottom:10px;
color:#5A67D8;
}

#result p{
line-height:1.7;
color:#555;
}

</style>

</head>
<body>

<div class="container">

<h1>🧠 Emotional Check-In</h1>

<p class="subtitle">
Take a quick 1-minute check-in to understand how you're feeling today.
</p>

<form id="quizForm">

<div class="question">

<h3>1. How are you feeling today?</h3>

<label><input type="radio" name="q1" value="1">😊 Happy</label>
<label><input type="radio" name="q1" value="2">😐 Okay</label>
<label><input type="radio" name="q1" value="3">😟 Anxious</label>
<label><input type="radio" name="q1" value="4">😔 Sad</label>

</div>

<div class="question">

<h3>2. How was your sleep last night?</h3>

<label><input type="radio" name="q2" value="1">😴 Great</label>
<label><input type="radio" name="q2" value="2">🙂 Fine</label>
<label><input type="radio" name="q2" value="3">😕 Poor</label>
<label><input type="radio" name="q2" value="4">😫 Very Bad</label>

</div>

<div class="question">

<h3>3. How stressed do you feel right now?</h3>

<label><input type="radio" name="q3" value="1">🌸 Not at all</label>
<label><input type="radio" name="q3" value="2">🙂 A little</label>
<label><input type="radio" name="q3" value="3">😣 Moderate</label>
<label><input type="radio" name="q3" value="4">😭 Very High</label>

</div>

<div class="question">

<h3>4. Which best describes your thoughts today?</h3>

<label><input type="radio" name="q4" value="1">🌈 Mostly Positive</label>
<label><input type="radio" name="q4" value="2">🌤️ Mixed Thoughts</label>
<label><input type="radio" name="q4" value="3">🌧️ Mostly Negative</label>
<label><input type="radio" name="q4" value="4">🌪️ Overwhelmed</label>

</div>

<div class="question">

<h3>5. How energetic do you feel today?</h3>

<label><input type="radio" name="q5" value="1">⚡ Very Energetic</label>
<label><input type="radio" name="q5" value="2">🙂 Normal</label>
<label><input type="radio" name="q5" value="3">😴 Low</label>
<label><input type="radio" name="q5" value="4">🥱 Exhausted</label>

</div>

<button type="button" onclick="checkResult()">
See My Result 💙
</button>

</form>

<div id="result">

<h2 id="title"></h2>

<p id="message"></p>

<br>

<button onclick="window.location.href='gratitude.html'">
Continue ➜ Gratitude Journal
</button>

</div>

</div>

<script>

function checkResult(){

let total=0;

for(let i=1;i<=5;i++){

const ans=document.querySelector('input[name="q'+i+'"]:checked');

if(!ans){

alert("Please answer all questions.");

return;

}

total+=parseInt(ans.value);

}

let title="";
let msg="";

if(total<=7){

title="😊 Mostly Calm";

msg="You're doing well. Keep taking care of yourself and continue your healthy habits.";

}

else if(total<=11){

title="🌿 Slightly Stressed";

msg="A short walk, deep breathing or talking to someone you trust may help today.";

}

else if(total<=16){

title="💙 Emotionally Tired";

msg="Take things slowly today. Give yourself permission to rest and recharge.";

}

else{

title="🤍 Feeling Overwhelmed";

msg="Take one step at a time. If these feelings continue, consider talking with someone you trust or a mental health professional.";

}

document.getElementById("quizForm").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("title").innerHTML=title;

document.getElementById("message").innerHTML=msg;

}

</script>

</body>
</html>
