<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratitude Journal | GenAI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#EEF5FF,#F6F2FF);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:390px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#5A67D8;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

textarea{
width:100%;
height:70px;
padding:12px;
margin:10px 0;
border-radius:12px;
border:1px solid #ddd;
resize:none;
font-size:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#5A67D8;
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#4654c8;
}

.entries{
margin-top:25px;
}

.entry{
background:#F8F9FF;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

.entry small{
color:#777;
display:block;
margin-bottom:8px;
}

.entry p{
margin:6px 0;
line-height:1.5;
}

</style>

</head>

<body>

<div class="container">

<h1>🌸 Gratitude Journal</h1>

<p class="subtitle">
Small moments of gratitude can make a big difference.
</p>

<textarea id="g1" placeholder="✨ One thing I'm grateful for..."></textarea>

<textarea id="g2" placeholder="😊 Another thing I'm thankful for..."></textarea>

<textarea id="goal" placeholder="🎯 One goal for tomorrow..."></textarea>

<button onclick="saveEntry()">
💙 Save Journal
</button>

<div class="entries">

<h2 style="margin:20px 0;color:#5A67D8;">
📖 Previous Entries
</h2>

<div id="history"></div>

</div>

</div>

<script>

const historyBox=document.getElementById("history");

function loadEntries(){

const entries=
JSON.parse(localStorage.getItem("gratitudeEntries"))||[];

historyBox.innerHTML="";

entries.forEach(item=>{

historyBox.innerHTML+=`

<div class="entry">

<small>${item.date}</small>

<p>✨ ${item.g1}</p>

<p>😊 ${item.g2}</p>

<p>🎯 ${item.goal}</p>

</div>

`;

});

}

function saveEntry(){

const g1=document.getElementById("g1").value.trim();

const g2=document.getElementById("g2").value.trim();

const goal=document.getElementById("goal").value.trim();

if(!g1||!g2||!goal){

alert("Please fill all fields 💙");

return;

}

const entries=
JSON.parse(localStorage.getItem("gratitudeEntries"))||[];

entries.unshift({

date:new Date().toLocaleString(),

g1,

g2,

goal

});

localStorage.setItem(
"gratitudeEntries",
JSON.stringify(entries)
);

alert("🌸 Journal Saved Successfully!");

document.getElementById("g1").value="";
document.getElementById("g2").value="";
document.getElementById("goal").value="";

loadEntries();

}

loadEntries();

</script>

</body>
</html>
